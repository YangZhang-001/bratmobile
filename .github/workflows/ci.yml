
name: ci
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run : |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libopencv-dev libboost-all-dev xorg-dev libglu1-mesa-dev libgtest-dev
      - name : Install Box2D v2.4.1
        shell: bash
        run : |
          cd ..
          git clone https://github.com/glafratta/box2d.git
          cd box2d
          cmake .
          sudo make install
          cd ../bratmobile
      - name : Install CppTimer
        shell: bash
        run : |
          cd ..
          git clone https://github.com/berndporr/cppTimer.git
          cd cppTimer
          cmake . && make
          sudo make install
          cd ../bratmobile
      - name : Build
        shell: bash
        run : sh build.sh
  test:
    runs-on: ubuntu-22.04
    steps:
      - name : Test
        run: |
              cd test/unit_test & ctest --output-on-failure
  make-docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name : Install Doxygen
        run: |
           sudo apt-get install doxygen
            doxygen doxygen/Doxyfile 
      - name: Disable Jekyll
        run: touch doxygen/docs/html/.nojekyll
      - name : Doxygen
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doxygen/docs/html




