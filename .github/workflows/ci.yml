
name: ci
on: 
  push:
    paths:
      - 'src/*'
      - 'test/unit_test/*'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run : |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libopencv-dev libboost-all-dev xorg-dev libglu1-mesa-dev libgtest-dev
      - name : Install Box2D v2.4.1
        shell: bash
        run : |
          cd ..
          git clone https://github.com/glafratta/box2d.git
          cd box2d
          cmake .
          sudo make install
          cd ../bratmobile
      - name : Install CppTimer
        shell: bash
        run : |
          cd ..
          git clone https://github.com/berndporr/cppTimer.git
          cd cppTimer
          cmake . && make
          sudo make install
          cd ../bratmobile
      - name : Build
        shell: bash
        run : sh build.sh
  test:
    runs-on: ubuntu-22.04
    steps:
      - name : Test
        run: |
              cd test/unit_test & ctest --output-on-failure
      - name : Push to data repo
        if : ${{ success()}}
        env: 
            GIT-USER: glafratta
            TARGET_REPO: ${{secrets.DATA_REP0_NAME}}
            SSH_PRIVATE_KEY: ${{secrets.DATA_PUSH_SSH_KEY}}
          run: |
              # echo "Setting up SSH key"
              # mkdir -p ~/.ssh
              # echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
              # chmod 600 ~/.ssh/id_rsa
              # ssh-keyscan github.com >> ~/.ssh/known_hosts
              git clone "$TARGET_REPO" data_stats
              cd data_stats
              cp ../benchmarkx* . -r
              git config user.name "$GIT_USER"
              git config user.email "$GIT_USER@users.noreply.github.com"

              git add .
              git commit -m "Update data from tests on $GITHUB_SHA"
              git push origin main






