name: ci

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run : |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libopencv-dev libboost-all-dev xorg-dev libglu1-mesa-dev libgtest-dev
      - name : Install Box2D v2.4.1
        shell: bash
        run : |
          cd ..
          git clone https://github.com/glafratta/box2d.git
          cd box2d
          cmake .
          sudo make install
          cd ../bratmobile
      - name : Install CppTimer
        shell: bash
        run : |
          cd ..
          git clone https://github.com/berndporr/cppTimer.git
          cd cppTimer
          cmake . && make
          sudo make install
          cd ../bratmobile
      - name : Build
        shell: bash
        run : sh build.sh
      - name : Test
        run: make test
