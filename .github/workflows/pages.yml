name: pages
on: 
  push:
    branches:
      - closing_loop_tracker

jobs:
  make-docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name : Install Doxygen
        run: |
           sudo apt-get install doxygen
            doxygen Doxyfile 
      - name: Disable Jekyll Theme
        run: touch docs/.nojekyll
